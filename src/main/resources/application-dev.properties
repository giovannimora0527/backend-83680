spring.application.name=clinica

server.port=8080

server.tomcat.max-threads=32

server.servlet.contextPath=/clinica/v1

# Conexion BD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=jdbc:mysql://localhost:3306/clinica?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota

spring.datasource.username=root

spring.datasource.password=1234

# JPA
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true