services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: clinica
      MYSQL_ROOT_PASSWORD: clinica123
    volumes:
      - mysql-data:/var/lib/mysql
      - ../backup-session.sql:/docker-entrypoint-initdb.d/01-backup.sql:ro
      - ./BackendParcialAlmaHernandez/src/main/resources/db/examen-final-migration.sql:/docker-entrypoint-initdb.d/02-final.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pclinica123"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build: ./BackendParcialAlmaHernandez
    environment:
      DB_URL: jdbc:mysql://mysql:3306/clinica
      DB_USERNAME: root
      DB_PASSWORD: clinica123
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./FrontendParcialAlmaHernandez
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  mysql-data:
